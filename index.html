  <div id="root"></div>
  <script>
  // Plain, untouched-by-build vanilla JS (ES5 only, on purpose) so this keeps
  // working even if the React bundle itself fails to *parse* on an old/odd
  // browser engine (a parse failure means the bundle's own error handlers
  // never get a chance to register). This is our last line of defense: turn
  // a blank screen into a readable message telling us what actually broke.
  (function () {
    function showOverlay(title, detail) {
      if (document.getElementById('fatal-error-overlay')) { return; }
      var el = document.createElement('div');
      el.id = 'fatal-error-overlay';
      el.setAttribute('dir', 'ltr');
      el.style.cssText = 'position:fixed;inset:0;background:#1a0b2e;color:#f5f3ff;padding:24px;' +
        'overflow:auto;font-family:monospace;font-size:13px;line-height:1.6;z-index:999999;' +
        'direction:ltr;text-align:left;';
      var titleDiv = document.createElement('div');
      titleDiv.style.cssText = 'color:#ff6b6b;font-weight:bold;font-size:16px;margin-bottom:12px;';
      titleDiv.textContent = title;
      var pre = document.createElement('pre');
      pre.style.cssText = 'white-space:pre-wrap;word-break:break-word;opacity:0.85;';
      pre.textContent = detail;
      var ua = document.createElement('div');
      ua.style.cssText = 'margin-top:12px;opacity:0.6;';
      ua.textContent = 'User agent: ' + navigator.userAgent;
      el.appendChild(titleDiv);
      el.appendChild(pre);
      el.appendChild(ua);
      document.body.appendChild(el);
    }

    window.addEventListener('error', function (e) {
      var detail = '';
      if (e.error && e.error.stack) { detail = e.error.stack; }
      else { detail = e.message + ' (' + e.filename + ':' + e.lineno + ':' + e.colno + ')'; }
      showOverlay('Site crashed - please screenshot this and send it', detail);
    });
    // Capture-phase listener: resource load failures (e.g. the main script or
    // stylesheet 404ing because a cached page still points at an old,
    // no-longer-deployed hashed filename) fire an 'error' event on the
    // <script>/<link> element itself, which does NOT bubble to window and so
    // is invisible to the listener above. Listening in the capture phase is
    // the only way to catch this case, and it is the most common real-world
    // cause of a truly blank page with no visible JS error.
    window.addEventListener('error', function (e) {
      var target = e.target;
      if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
        var src = target.src || target.href || '(unknown)';
        showOverlay(
          'Site failed to load a required file - please screenshot this and send it',
          'Failed to load: ' + src + '\nThis usually means the browser or a CDN cached an old ' +
            'version of the page that points at a file which no longer exists after ' +
            'the last deploy. Try a hard refresh / clear the site\'s cache.'
        );
      }
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      var reason = e.reason;
      var detail = (reason && reason.stack) ? reason.stack : String(reason);
      showOverlay('Site crashed (promise) - please screenshot this and send it', detail);
    });

    // Safety net for silent failures (nothing thrown, React just never mounts):
    // if #root is still empty a few seconds after load, something's wrong.
    window.addEventListener('load', function () {
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.children.length === 0 && !document.getElementById('fatal-error-overlay')) {
          showOverlay(
            'Site did not load - please screenshot this and send it',
            'The page loaded but nothing rendered, and no JS error was caught.\n' +
              'This usually means the main script failed silently or is blocked.'
          );
        }
      }, 4000);
    });
  })();
  </script>
